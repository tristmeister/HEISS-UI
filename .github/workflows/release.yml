name: Release

# `npm run release` bumps the version, dates CHANGELOG.md and tags vX.Y.Z;
# pushing that tag publishes a prebuilt download (the built app plus the
# server, no sources or build tools) with the changelog section as notes.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Check the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/')
        run: test "v$(node -p "require('./package.json').version")" = "${GITHUB_REF_NAME}"
      # Signs every zip with the release key (a <zip>.sig beside it) that installed
      # copies check before updating; see server/release-signing.js. A tag build
      # stops here if the app trusts a key and this secret is missing.
      - run: npm run package
        env:
          HEISS_RELEASE_SIGNING_KEY: ${{ secrets.HEISS_RELEASE_SIGNING_KEY }}
      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        # The notes are that version's CHANGELOG.md section (scripts/release.mjs writes it).
        run: |
          shopt -s nullglob
          node scripts/changelog.mjs notes "${GITHUB_REF_NAME}" > release-notes.md
          gh release create "${GITHUB_REF_NAME}" release/*.zip release/*.zip.sig --title "HEISS UI ${GITHUB_REF_NAME}" --notes-file release-notes.md
      - name: Keep the package as a build artifact
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: heiss-ui-release
          path: |
            release/*.zip
            release/*.zip.sig
